name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable so `release.yml` can require *this* gate rather than a copy of it.
  # A duplicated pre-publish check is a check that drifts; this way the bar a
  # tag has to clear is the same bar a pull request clears, by construction.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  supply-chain:
    name: Supply chain
    uses: ./.github/workflows/supply-chain.yml
    permissions:
      contents: read

  lint:
    name: Quality / Style, types & inventories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python & dependency cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: auto
          cache-suffix: quality
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          version: "latest-known"
          python-version: "3.13"
      - name: Install quality tools & backends
        run: uv sync --locked --all-extras --group dev --reinstall-package unstd --python 3.13
      - name: Validate test ownership & CI groups
        run: uv run --no-sync python -m tests.tooling.ci check
      - name: Validate fuzz targets & corpus
        run: uv run --no-sync python -m tests.tooling.fuzz check
      - name: Validate fault-injection scenarios
        run: uv run --no-sync python -m tests.tooling.chaos check
      - name: Validate concurrency scenarios
        run: uv run --no-sync python -m tests.tooling.concurrency check
      - name: Check style & imports
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Check type contracts
        run: uv run --no-sync mypy

  test:
    name: ${{ matrix.group.name }} / ${{ matrix.environment.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Groups select owned suite paths. Every environment retains full coverage.
        group:
          - {id: api, name: API & regressions}
          - {id: contracts, name: Compatibility & boundaries}
          - {id: tooling, name: Test tooling & corpus}
          - {id: packaging, name: Packaging & consumers}
        environment:
          - {id: py312, name: Python 3.12, python: "3.12", sync: "--locked --all-extras", pytest: "--require-extras"}
          - {id: py313, name: Python 3.13, python: "3.13", sync: "--locked --all-extras", pytest: "--require-extras"}
          - {id: py314, name: Python 3.14, python: "3.14", sync: "--locked --all-extras", pytest: "--require-extras"}
          # Floors remain unlocked; --no-sync below preserves lowest-direct.
          - {id: floors, name: Dependency floors (3.13), python: "3.13", sync: "--all-extras --resolution lowest-direct", pytest: "--require-extras"}
          - {id: fallback, name: Base install (3.13), python: "3.13", sync: "--locked", pytest: ""}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python & dependency cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: auto
          cache-suffix: tests-${{ matrix.environment.id }}-${{ matrix.group.id }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          version: "latest-known"
          python-version: ${{ matrix.environment.python }}
      - name: Install test environment & rebuild local extensions
        run: uv sync ${{ matrix.environment.sync }} --group dev --reinstall-package unstd --python ${{ matrix.environment.python }}
      - name: Show resolved backend versions
        if: matrix.environment.id == 'floors' || matrix.environment.id == 'fallback'
        run: uv pip list
      - name: Prime offline artifact build dependencies
        if: matrix.group.id == 'packaging'
        run: uv build --python ${{ matrix.environment.python }} --sdist --wheel --out-dir "$RUNNER_TEMP/unstd-build-cache"
      - name: Run ${{ matrix.group.name }}
        run: uv run --no-sync python -m tests.tooling.ci run ${{ matrix.group.id }} -- ${{ matrix.environment.pytest }} -q
      - name: Retain grouped test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-${{ matrix.group.id }}-${{ matrix.environment.id }}-${{ github.run_attempt }}
          path: .local/ci/${{ matrix.group.id }}.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  resources:
    name: Resource bounds / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python & dependency cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: auto
          version: "latest-known"
          python-version: "3.13"
          cache-suffix: resources
          cache-dependency-glob: "uv.lock\npyproject.toml\n"
      - name: Install test environment
        run: uv sync --locked --all-extras --group dev --python 3.13 --reinstall-package unstd
      # The suite owns both installed and import-blocked stdlib worker policies.
      - name: Check memory, cleanup, cache lifetime & depth
        id: tests
        run: >-
          uv run --no-sync python -m tests.tooling run resources --
          --require-extras -q --junitxml=.local/resources.xml
      - name: Summarize resource bounds
        if: always() && steps.tests.outcome != 'skipped'
        env:
          TEST_EXIT: ${{ steps.tests.outcome == 'success' && '0' || '1' }}
        run: uv run --no-sync python -m tests.tooling.ci report "Resource bounds" .local/resources.xml --exit-code "$TEST_EXIT"
      - name: Retain resource measurements and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resources-${{ matrix.os }}-${{ github.run_attempt }}
          path: .local/resources.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native:
    # Optional compiler failures are a consumer fallback, never a reason for
    # native parity tests to disappear behind importorskip in CI. Serde alone
    # leaves text's dependency-free implementation under test as well.
    name: Native safety / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      CIBUILDWHEEL: "1"
      PYTHONMALLOC: debug
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python & dependency cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: auto
          version: "latest-known"
          python-version: ${{ matrix.python-version }}
          cache-suffix: native
          cache-dependency-glob: "uv.lock\npyproject.toml\n"
      - name: Install test environment
        run: uv sync --locked --extra serde --group dev --python ${{ matrix.python-version }} --reinstall-package unstd
      - name: Every native module must import
        run: >-
          uv run --no-sync python -c
          "import unstd.serde._json_native, unstd.clone._clone_native, unstd.text._text_native"
      - name: Native compatibility with the debug allocator
        id: tests
        run: >
          uv run --no-sync python -m pytest tests/suites/product/clone tests/suites/product/text tests/suites/product/serde -q --junitxml=.local/native.xml

      - name: Summarize native safety
        if: always() && steps.tests.outcome != 'skipped'
        env:
          TEST_EXIT: ${{ steps.tests.outcome == 'success' && '0' || '1' }}
        run: uv run --no-sync python -m tests.tooling.ci report "Native safety" .local/native.xml --exit-code "$TEST_EXIT"
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ github.run_attempt }}-${{ matrix.python-version }}
          path: .local/native.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
    timeout-minutes: 15
  native-sanitizers:
    name: Native safety / ASan & UBSan
    runs-on: ubuntu-latest
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python & dependency cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: auto
          version: "latest-known"
          python-version: "3.13"
          cache-suffix: native-sanitizers
          cache-dependency-glob: "uv.lock\npyproject.toml\n"
      - name: Install test environment
        run: uv sync --locked --extra serde --group dev --no-install-project --python 3.13
      - name: Build our native modules with address and undefined behavior checks
        env:
          CC: gcc
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
          CIBUILDWHEEL: "1"
        run: uv pip install --python .venv/bin/python --no-deps --reinstall --editable .
      - name: Native compatibility under ASan and UBSan
        id: tests
        env:
          # CPython and imported third-party runtimes own process-lifetime
          # allocations. Bounds, use-after-free and UB checks remain fatal.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PYTHONMALLOC: malloc
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          export LD_PRELOAD
          .venv/bin/python -c "import unstd.serde._json_native, unstd.clone._clone_native, unstd.text._text_native"
          .venv/bin/python -m pytest tests/suites/product/clone tests/suites/product/text tests/suites/product/serde -q --junitxml=.local/native-sanitizers.xml

      - name: Summarize sanitizer checks
        if: always() && steps.tests.outcome != 'skipped'
        env:
          TEST_EXIT: ${{ steps.tests.outcome == 'success' && '0' || '1' }}
        run: uv run --no-sync python -m tests.tooling.ci report "Native sanitizers" .local/native-sanitizers.xml --exit-code "$TEST_EXIT"
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-sanitizers-${{ github.run_attempt }}
          path: .local/native-sanitizers.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
    timeout-minutes: 15
  result:
    name: CI / Required groups
    if: always()
    needs:
      - supply-chain
      - lint
      - test
      - resources
      - native
      - native-sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every group to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PYTHON'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("| Required group | Result |\n| --- | --- |\n")
              for name, job in results.items():
                  summary.write(f"| {name} | {job['result']} |\n")
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Required groups did not pass: " + ", ".join(failed))
          PYTHON
