name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable so `release.yml` can require *this* gate rather than a copy of it.
  # A duplicated pre-publish check is a check that drifts; this way the bar a
  # tag has to clear is the same bar a pull request clears, by construction.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    # Style, import order, docstring shape (ruff) and the type contract (mypy,
    # strict) — neither of which the test suite can observe. `--all-extras` so
    # mypy resolves the real backends instead of typing the fallbacks alone;
    # mypy judges against `python_version = "3.12"` from pyproject regardless of
    # the interpreter running it, so this needs one leg, not the matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "latest-known"
          python-version: "3.13"
      - run: uv sync --locked --all-extras --group dev --python 3.13
      - run: uv run --no-sync --python 3.13 python -m tests.tooling check
      - run: uv run --no-sync --python 3.13 python -m tests.tooling.fuzz check
      - run: uv run --no-sync --python 3.13 python -m tests.tooling.chaos check
      - run: uv run --no-sync --python 3.13 python -m tests.tooling.concurrency check
      - run: uv run --python 3.13 ruff check .
      - run: uv run --python 3.13 ruff format --check .
      - run: uv run --python 3.13 mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.12" in pyproject.toml — test the whole claimed
        # range, not just the pinned dev version. A change only exercised on
        # one interpreter silently drifts to that interpreter's syntax/stdlib
        # shape (e.g. PEP 758 bare-tuple `except`, 3.13's `batched(strict=)`).
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "latest-known"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras --group dev --python ${{ matrix.python-version }}
      - run: uv build --python ${{ matrix.python-version }} --sdist --wheel --out-dir "$RUNNER_TEMP/unstd-build-cache"
      - run: uv run --no-sync --python ${{ matrix.python-version }} pytest --require-extras -q

  resources:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "latest-known"
          python-version: "3.13"
      - run: uv sync --locked --all-extras --group dev --python 3.13
      # The suite owns both installed and import-blocked stdlib worker policies.
      - run: >-
          uv run --no-sync python -m tests.tooling run resources --
          --require-extras -q --junitxml=.local/resources.xml
      - name: Retain resource measurements and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resources-${{ matrix.os }}-${{ github.run_attempt }}
          path: .local/resources.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  floors:
    # Every extra declares a floor, and a floor is a promise: install this old a
    # backend and the library still works. Nothing else in this matrix tests it —
    # `test` resolves the newest of everything, so the floors could be fiction
    # for years and only a consumer with an older pin would ever find out, as a
    # resolver error blamed on their own manifest.
    #
    # `lowest-direct` takes the oldest version each DIRECT floor admits while
    # leaving transitives modern, which is the environment a downstream
    # application actually produces. A failure here means the floor is wrong, not
    # the code: raise it to the version that works and say so in the changelog.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "latest-known"
          python-version: "3.13"
      - run: uv sync --all-extras --group dev --python 3.13 --resolution lowest-direct
      # Which versions the floors admitted — the first thing anyone reading a
      # failure here needs, and not recoverable from the traceback.
      - run: uv pip list
      - run: uv build --python 3.13 --sdist --wheel --out-dir "$RUNNER_TEMP/unstd-build-cache"
      # `--no-sync` is what makes this job mean anything. A bare `uv run`
      # re-resolves in the default `highest` mode and quietly reinstalls the
      # newest of everything first, so the suite would run against the same
      # environment `test` already covers and pass no matter what the floors say.
      - run: uv run --no-sync --python 3.13 pytest --require-extras -q

  native:
    # Optional compiler failures are a consumer fallback, never a reason for
    # native parity tests to disappear behind importorskip in CI. Serde alone
    # leaves text's dependency-free implementation under test as well.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      CIBUILDWHEEL: "1"
      PYTHONMALLOC: debug
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "latest-known"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra serde --group dev --python ${{ matrix.python-version }}
      - name: Every native module must import
        run: >-
          uv run --no-sync python -c
          "import unstd.serde._json_native, unstd.clone._clone_native, unstd.text._text_native"
      - name: Native compatibility with the debug allocator
        run: >-
          uv run --no-sync python -m pytest
          tests/suites/product/clone tests/suites/product/text
          tests/suites/product/serde -q

  native-sanitizers:
    runs-on: ubuntu-latest
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "latest-known"
          python-version: "3.13"
      - run: uv sync --locked --extra serde --group dev --no-install-project --python 3.13
      - name: Build our native modules with address and undefined behavior checks
        env:
          CC: gcc
          CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
          CIBUILDWHEEL: "1"
        run: uv pip install --python .venv/bin/python --no-deps --reinstall --editable .
      - name: Native compatibility under ASan and UBSan
        env:
          # CPython and imported third-party runtimes own process-lifetime
          # allocations. Bounds, use-after-free and UB checks remain fatal.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          PYTHONMALLOC: malloc
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          .venv/bin/python -c "import unstd.serde._json_native, unstd.clone._clone_native, unstd.text._text_native"
          .venv/bin/python -m pytest tests/suites/product/clone tests/suites/product/text tests/suites/product/serde -q

  test-fallback:
    # A base install (no optional extras) is a load-bearing, documented contract
    # on nearly every module: each accelerated backend degrades to a
    # stdlib-faithful fallback. `test` above runs `--all-extras` on every leg, so
    # those fallback branches were only ever reached through monkeypatch-forced
    # fixtures inside the suite. This job takes the real path.
    #
    # Which modules can't be collected without their extra is decided by
    # `tests/conftest.py`, which centralizes module importability probes.
    # A hardcoded `--ignore` roster here would be a second copy of that
    # decision, and the copy that lives in CI is the one nobody updates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "latest-known"
          python-version: "3.13"
      - run: uv sync --locked --group dev --python 3.13
      - run: uv build --python 3.13 --sdist --wheel --out-dir "$RUNNER_TEMP/unstd-build-cache"
      # A diagnostic, not a gate — the zero-closure claim is asserted offline by
      # `tests/suites/assurance/gates/packaging/test_package.py`. A failure that reproduces
      # only on the fallback leg is nearly unreadable without knowing which
      # backends were actually present when it ran (the test tooling drags in a
      # couple of its own, e.g. hypothesis → sortedcontainers).
      - run: uv pip list
      - run: uv run --python 3.13 pytest -q
