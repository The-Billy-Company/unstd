name: Performance

on:
  pull_request:
    paths:
      - "src/unstd/**"
      - "native/**"
      - "bench/**"
      - "hatch_build.py"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/tooling/runtime/json_acceleration.py"
      - ".github/workflows/performance.yml"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Git ref to measure before the selected revision"
        required: true
        default: main
        type: string
      gzip_diagnostic:
        description: "Run only the bounded gzip read/inflater comparison"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Match CI's interpreter and SDK provider for every matrix request.
  UV_MANAGED_PYTHON: "1"

concurrency:
  group: performance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    # Keep the existing Linux 3.13 context; exercise 3.14's distinct C fast paths.
    name: ${{ inputs.gzip_diagnostic && 'Gzip read diagnosis' || 'Function latency' }} / Python ${{ matrix.python }}${{ matrix.check_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            python: "3.13"
            check_suffix: ""
          - os: macos-latest
            platform: macos
            python: "3.13"
            check_suffix: " / macOS"
          - os: ubuntu-latest
            platform: linux
            python: "3.14"
            check_suffix: ""
          - os: macos-latest
            platform: macos
            python: "3.14"
            check_suffix: " / macOS"
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      # A failed native build must fail the comparison, not select a fallback.
      CIBUILDWHEEL: "1"
    steps:
      - name: Check out current source and harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out comparison source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          path: .local/performance/source-before
          persist-credentials: false
      - name: Set up Python and locked dependency cache
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      - name: Install one shared dependency environment
        run: >-
          uv sync --locked --all-extras --group dev --group build --group bench
          --no-install-project --python "${{ matrix.python }}"
      - name: Record revision identities
        run: |
          mkdir -p .local/performance/evidence
          git rev-parse HEAD > .local/performance/evidence/current-revision.txt
          git -C .local/performance/source-before rev-parse HEAD > .local/performance/evidence/before-revision.txt
      - name: Verify and record the shared managed interpreter
        env:
          PERF_PYTHON_VERSION: ${{ matrix.python }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import sys
          import sysconfig
          expected = os.environ["PERF_PYTHON_VERSION"]
          actual = ".".join(map(str, sys.version_info[:2]))
          provider = Path(sys._base_executable).resolve()
          managed = Path(os.environ["UV_PYTHON_INSTALL_DIR"]).resolve()
          if os.environ.get("UV_MANAGED_PYTHON") != "1":
              raise RuntimeError("performance requires CI's managed Python policy")
          if actual != expected or not provider.is_relative_to(managed):
              raise RuntimeError(f"wrong performance interpreter: {actual}, {provider}")
          report = {
              "requested_python": expected,
              "version": sys.version,
              "executable": sys.executable,
              "provider": str(provider),
              "managed_install_dir": str(managed),
              "implementation": sys.implementation.name,
              "compiler": platform.python_compiler(),
              "build": platform.python_build(),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "sdk": {key: sysconfig.get_config_var(key) for key in (
                  "CC", "CFLAGS", "LDSHARED", "SOABI", "EXT_SUFFIX",
                  "INCLUDEPY", "CONFIG_ARGS", "Py_TAIL_CALL_INTERP",
              )},
              "builds": ["installed-before", "installed-current"],
          }
          Path(".local/performance/evidence/runtime.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          PY
      # Build each revision's own native modules. Neither measurement may load
      # the other revision's Python source or compiled kernels.
      - name: Provide Yasm for native gzip builds
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends yasm
          yasm --version
      - name: Build separate before and current installations
        run: |
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation --no-cache --target .local/performance/installed-before .local/performance/source-before
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation --no-cache --target .local/performance/installed-current .
      - name: Verify isolated product and shared harness imports
        run: |
          for revision in before current; do
            export PERF_INSTALL_ROOT="$GITHUB_WORKSPACE/.local/performance/installed-$revision"
            PYTHONPATH="$PERF_INSTALL_ROOT:$GITHUB_WORKSPACE" .venv/bin/python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import bench.speeds
          import unstd
          expected = Path(os.environ["PERF_INSTALL_ROOT"]) / "unstd"
          if Path(unstd.__file__).resolve().parent != expected.resolve():
              raise RuntimeError(f"wrong product import: {unstd.__file__}")
          harness = Path(os.environ["GITHUB_WORKSPACE"]) / "bench/speeds.py"
          if Path(bench.speeds.__file__).resolve() != harness.resolve():
              raise RuntimeError(f"wrong benchmark harness: {bench.speeds.__file__}")
          for name in bench.speeds._NATIVE:
              spec = importlib.util.find_spec(f"unstd.{name}")
              if spec and spec.origin and not Path(spec.origin).resolve().is_relative_to(expected.resolve()):
                  raise RuntimeError(f"wrong native module import: {spec.origin}")
          PY
          done
      - name: Verify installed JSON accelerations
        if: ${{ !inputs.gzip_diagnostic }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.local/performance/installed-current:${{ github.workspace }}
        run: >-
          .venv/bin/python tests/tooling/runtime/json_acceleration.py --json
          > .local/performance/evidence/json-native.json
      - name: Guard installed JSON record latency
        if: ${{ !inputs.gzip_diagnostic }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.local/performance/installed-current:${{ github.workspace }}
        run: >-
          .venv/bin/python -m bench.profiles.jsonx_throughput
          --compare-source .local/performance/installed-before
          --source .local/performance/installed-current
          --require-native --include records-1k
          --rounds 7 --repetitions 3 --max-slowdown 1.15
          --output .local/performance/evidence/json-records.json
      - name: Guard shared and independent JSON rows
        if: ${{ !inputs.gzip_diagnostic }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.local/performance/installed-current:${{ github.workspace }}
        run: >-
          .venv/bin/python -m bench.profiles.jsonx_throughput
          --compare-source .local/performance/installed-before
          --source .local/performance/installed-current
          --require-native --include floats-256
          --rounds 7 --repetitions 3 --max-slowdown 1.15
          --output .local/performance/evidence/json-shared.json
      # The committed laptop snapshot has a different environment. Record the
      # old revision on THIS worker, then compare current against that file.
      # Both passes use exactly the current workload definitions and backends.
      # An older revision cannot implement newly added APIs. Inventory its own
      # exports, compare every shared workload, and report additions separately.
      - name: Freeze comparison revision on this worker
        if: ${{ !inputs.gzip_diagnostic }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.local/performance/installed-before:${{ github.workspace }}
        run: >-
          .venv/bin/python -m bench.speeds freeze --rounds 9
          --comparison-source .local/performance/source-before/src/unstd
          --baseline .local/performance/evidence/baseline.json
          --output .local/performance/evidence/before.json
      - name: Guard Billy gzip consumer latency with frozen transport fixtures
        if: ${{ !inputs.gzip_diagnostic }}
        run: >-
          .venv/bin/python bench/profiles/billy_gzip.py run
          --fixtures bench/workloads/billy_gzip.json.gz
          --baseline-source .local/performance/installed-before
          --source .local/performance/installed-current
          --rounds 7 --repetitions 3 --max-slowdown 1.30
          --output .local/performance/evidence/billy-gzip.json
      - name: Verify current revision against the frozen worker baseline
        if: ${{ !inputs.gzip_diagnostic }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.local/performance/installed-current:${{ github.workspace }}
        run: >-
          .venv/bin/python -m bench.speeds verify --rounds 9
          --revision-baseline
          --reference-report .local/performance/evidence/before.json
          --baseline .local/performance/evidence/baseline.json
          --output .local/performance/evidence/current.json
      - name: Guard native clone graphs and dataclass latency
        if: ${{ !inputs.gzip_diagnostic }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.local/performance/installed-current:${{ github.workspace }}
        run: >-
          .venv/bin/python -m bench.profiles.clone_common_cpu
          --compare-dir .local/performance/installed-before/unstd/clone
          --infer-native-bindings --require-native --gc-enabled
          --rounds 9 --max-slowdown 1.10
          --output .local/performance/evidence/clone-common.json
      - name: Guard ordinary Jaro contact matching and path scoring
        if: ${{ !inputs.gzip_diagnostic }}
        run: >-
          .venv/bin/python bench/profiles/text_jaro_normal.py
          --baseline-source .local/performance/installed-before
          --candidate-source .local/performance/installed-current
          --baseline-native .local/performance/installed-before/unstd/text/_text_native*.so
          --candidate-native .local/performance/installed-current/unstd/text/_text_native*.so
          --rounds 7 --minimum-speedup 0.80 --max-slowdown 1.30
          --output .local/performance/evidence/text-jaro-normal.json
      - name: Retain both native gzip builds for diagnosis
        if: ${{ inputs.gzip_diagnostic }}
        run: |
          .venv/bin/python - <<'PYTHON'
          from pathlib import Path
          import shutil
          import sysconfig
          root = Path(".local/performance")
          for revision in ("before", "current"):
              (binary,) = (root / f"installed-{revision}/unstd/compress").glob("_gzip_native*.so")
              if (not binary.is_file() or binary.is_symlink()
                      or binary.name != f"_gzip_native{sysconfig.get_config_var('EXT_SUFFIX')}"):
                  raise RuntimeError(f"not the built native gzip module: {binary}")
              destination = root / f"evidence/native-{revision}"
              destination.mkdir()
              shutil.copyfile(binary, destination / binary.name)
          PYTHON
      - name: Diagnose gzip reads with isolated native controls
        if: ${{ inputs.gzip_diagnostic }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.local/performance/installed-current:${{ github.workspace }}
        run: >-
          .venv/bin/python -m bench.diagnostics.gzip_reads run --rounds 9
          --before-install .local/performance/installed-before
          --current-install .local/performance/installed-current
          --output .local/performance/evidence/gzip-control.json
      - name: Retain baseline, measurements and revision identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: function-speeds-${{ matrix.platform }}-${{ matrix.python }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/performance/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
