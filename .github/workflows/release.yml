# Build and verify native wheels before publishing a version tag to PyPI.
#
# ONE-TIME SETUP: PyPI Trusted Publishing, no API token in this repo.
# On PyPI, add a trusted publisher for the `unstd` project pointing at this
# repository, workflow `release.yml`, environment `pypi`. Before the project
# exists this is a pending publisher under Your projects -> Publishing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_MANAGED_PYTHON: "1"

jobs:
  ci-status:
    name: Reuse recent exact-commit CI
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.ci.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate existing CI evidence or request the full gate
        id: ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tests/tooling/release/reuse_ci.py

  # A tag push used to publish unconditionally — nothing stood between `git tag`
  # and PyPI, and a release is the one artifact that cannot be taken back. The
  # CI and artifact construction run concurrently. Publication requires both
  # verified artifacts and successful exact-commit CI evidence. A recent main
  # or manual CI run is reused; otherwise the complete reusable gate runs.
  gate:
    needs: ci-status
    if: needs.ci-status.outputs.reused != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  wheels:
    needs: sdist
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest, windows-11-arm]
        python: ["312", "313", "314"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify reusable build dependencies
        id: dependencies
        run: python tests/tooling/release/cache_key.py
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # Match the main-branch warmup: tags cannot read earlier tag caches.
          cache-suffix: release-${{ matrix.os }}-${{ matrix.python }}-${{ steps.dependencies.outputs.key }}
          cache-dependency-glob: ""
          prune-cache: false
          version: "0.13.5"
          python-version: "3.14"
      - name: Download the shared source distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-raw-source
          path: source
      - name: Install audited release tools from the lock
        run: uv sync --locked --only-group release --no-install-project
      - name: Check the release interpreter's TLS security fixes
        run: uv run --no-sync python -m tests.tooling.runtime --json
      - name: Constrain platform repair tools to audited versions
        run: uv export --locked --only-group release --no-emit-project --no-header --output-file "${{ runner.temp }}/release-constraints.txt"
      - name: Build and test CPython wheels
        shell: bash
        env:
          CIBW_BUILD: cp${{ matrix.python }}-*
          # Keep Python/NuGet downloads beside uv's cached dependency wheels.
          CIBW_CACHE_PATH: ${{ env.UV_CACHE_DIR }}/cibuildwheel
          # Use uv's fast isolated builder and authenticate the build closure
          # exported from the same lock embedded in the published sdist.
          CIBW_BEFORE_ALL_LINUX: >-
            uv export --project "{package}" --locked --only-group release-uv
            --no-emit-project --no-header --output-file release-uv.txt &&
            python -m pip install --prefix /usr/local --no-deps --only-binary :all:
            --require-hashes --requirement release-uv.txt &&
            python "{package}/tests/tooling/release/wheels.py" --linux-runtime cp${{ matrix.python }}
          CIBW_ENVIRONMENT_LINUX: "UNSTD_WHEEL_COMPILER_CONFIG=/tmp/unstd-wheel-compiler.json"
          CIBW_BEFORE_BUILD: >-
            uv export --project "{package}" --locked --only-group build
            --no-emit-project --no-header --output-file build-constraints.txt
          CIBW_BUILD_FRONTEND: "uv; args: --build-constraints build-constraints.txt --require-hashes"
          # cibuildwheel changes the host cwd after extracting the sdist.
          # It resolves this file on the host before copying it into containers.
          CIBW_DEPENDENCY_VERSIONS: ${{ runner.temp }}/release-constraints.txt
          # Test dependencies execute beside the files being released. Install
          # the audited hashes instead of resolving test-extras/test-requires.
          CIBW_TEST_EXTRAS: ""
          CIBW_TEST_REQUIRES: ""
          CIBW_BEFORE_TEST: >-
            uv export --project "{package}" --locked --only-group backend-build
            --no-emit-project --no-header --output-file test-build-constraints.txt &&
            uv pip install --no-deps --only-binary :all: --require-hashes
            --requirements test-build-constraints.txt &&
            uv export --project "{package}" --locked --extra serde --extra crypto --extra compress --extra containers --extra rand
            --no-default-groups --group supply-chain
            --no-emit-project --no-header --output-file test-requirements.txt &&
            uv pip install --no-deps --require-hashes --require-build-hashes
            --build-constraints test-build-constraints.txt --requirements test-requirements.txt
        run: uv run --no-sync python -m tests.tooling.release.wheels source/*.tar.gz --output-dir dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-raw-wheels-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.13.5"
          python-version: "3.14"
      - name: Export authenticated build requirements
        run: uv export --locked --only-group build --no-emit-project --no-header --output-file "$RUNNER_TEMP/build-constraints.txt"
      - name: Build the source distribution with audited tools
        run: uv build --sdist --build-constraints "$RUNNER_TEMP/build-constraints.txt" --require-hashes
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-raw-source
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the artifact verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download only release distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-raw-*
          path: dist
          merge-multiple: true
      - name: Verify every archive, metadata field & wheel RECORD
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          mkdir -p evidence
          tag_args=()
          if [ -n "$RELEASE_TAG" ]; then tag_args=(--tag "$RELEASE_TAG"); fi
          python -m tests.tooling.release verify --dist dist "${tag_args[@]}" --manifest evidence/manifest.json
          cp tests/tooling/release/verify.py evidence/release.py
      - name: Retain verified distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-verified
          path: dist/*
          if-no-files-found: error
      - name: Retain release checksums & standalone verifier
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-evidence
          path: evidence/*
          if-no-files-found: error

  pypi:
    needs: [ci-status, gate, verify]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success' &&
      needs.ci-status.result == 'success' &&
      (needs.gate.result == 'success' || needs.ci-status.outputs.reused == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-verified
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-evidence
          path: evidence
      - name: Authenticate the exact files at the publishing boundary
        env:
          TAG: ${{ github.ref_name }}
        run: python -I evidence/release.py verify --dist dist --expected-manifest evidence/manifest.json --tag "$TAG"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
