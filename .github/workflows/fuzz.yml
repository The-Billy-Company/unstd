name: Fuzz campaigns

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  campaign:
    name: Parser fuzzing / Python ${{ matrix.python }} / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    # Eleven installed targets × replay/mutation × (30s + 120s), plus overhead.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        backend: [installed, stdlib]
    env:
      UNSTD_CAMPAIGN_REPORTING: "1"
      RUNS: ${{ github.event_name == 'schedule' && '100000' || '1000' }}
      WALL: ${{ github.event_name == 'schedule' && '120' || '30' }}
      CPU: ${{ github.event_name == 'schedule' && '110' || '20' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and cached dependencies
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          version: "0.13.5"
          python-version: ${{ matrix.python }}
      # The fuzz group installs Atheris only on its supported Python 3.12 lane.
      # Python 3.14 exercises the deployed runtime with deterministic mutation.
      - name: Provide Yasm for native gzip builds
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends yasm
          yasm --version
      - name: Install locked dependencies and rebuild unstd
        id: dependencies
        run: uv sync --locked --all-extras --group dev --group fuzz --python ${{ matrix.python }} --reinstall-package unstd
      - name: All parsers / replay and deterministic mutation
        run: >-
          uv run --no-sync python -m tests.tooling.fuzz campaign
          --target all --backend ${{ matrix.backend }}
          --engine deterministic --runs 1000 --seed 173
          --wall-seconds 30 --cpu-seconds 20
          --artifact-dir .local/fuzz/deterministic
      - name: All parsers / instrumented coverage
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && matrix.python == '3.12' }}
        run: >-
          uv run --no-sync python -m tests.tooling.fuzz campaign
          --target all --backend ${{ matrix.backend }}
          --engine atheris --runs "$RUNS" --seed 173
          --wall-seconds "$WALL" --cpu-seconds "$CPU"
          --artifact-dir .local/fuzz/atheris
      - name: Retain reports, findings, and coverage corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.python }}-${{ matrix.backend }}-${{ github.run_attempt }}
          path: .local/fuzz/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
