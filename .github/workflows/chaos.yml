name: Fault injection

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  campaign:
    name: Fault injection / ${{ matrix.platform }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    # Three groups × ten rounds × 120s, plus setup, cleanup and evidence upload.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [installed, stdlib]
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
    env:
      UNSTD_CAMPAIGN_REPORTING: "1"
      ROUNDS: ${{ github.event_name == 'schedule' && '10' || '1' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and cached dependencies
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          version: "0.13.4"
          python-version: "3.13"
      # Both lanes install extras; the stdlib worker blocks acceleration imports
      # before product loading, and propagates that policy into nested workers.
      - name: Install locked dependencies and rebuild unstd
        run: uv sync --locked --all-extras --group dev --python 3.13 --reinstall-package unstd
      - name: Run all fault injection groups
        run: >-
          uv run --no-sync python -m tests.tooling.chaos run
          --group all --backend ${{ matrix.backend }}
          --seed 173 --rounds "$ROUNDS"
          --wall-seconds 120 --per-test-seconds 45 --cpu-seconds 60 --memory-mb 2048
          --artifact-dir .local/chaos/
      - name: Retain schedules, observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chaos-${{ matrix.backend }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: .local/chaos/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
